# Мінімальна робоча конфігурація: балансування round-robin між інстансами booking-api.
# TODO(Астахов): тюнінг під навантаження (worker_connections, розмір пулу keepalive, таймаути proxy_*) — під spike-тестом немає 502/504 від nginx і помилок "worker_connections are not enough" у логах.
# TODO(Астахов): коректна робота при масштабуванні — nginx резолвить booking-api лише при старті, тому після `--scale` потрібен перезапуск nginx або resolver 127.0.0.11 з динамічним upstream; описати обраний варіант у README — після переходу з 1 на 3 інстанси запити розподіляються на всі 3 (видно в X-Instance).

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream booking_api {
        server booking-api:8080;
        # Пул постійних з'єднань до API. Без нього nginx відкриває нове TCP-з'єднання на кожен запит
        # і під spike-тестом вичерпує ефемерні порти: "connect() failed (99: Address not available)".
        keepalive 128;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://booking_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
