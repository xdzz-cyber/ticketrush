name: ticketrush

# Усі порти опубліковано лише на 127.0.0.1: логіни/паролі тут — тестові й публічні (див. .env.example),
# а Redis без пароля, тому інфраструктура не повинна бути доступна з інших машин у мережі.
services:
  redis:
    image: redis:7.4-alpine
    # AOF обов'язковий: Redis — джерело правди про залишок місць. Без нього після рестарту Redis
    # Booking API заново заллє початковий залишок і вже продані місця підуть у продаж удруге.
    # everysec — компроміс: під час краху можна втратити до ~1 с записів, ціна на швидкості мізерна.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes:
      - redis-data:/data
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ticketrush
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ticketrush}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketrush
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketrush}
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush -d ticketrush"]
      interval: 5s
      timeout: 3s
      retries: 10

  booking-api:
    build:
      context: .
      dockerfile: src/TicketRush.BookingApi/Dockerfile
    environment:
      Redis__ConnectionString: redis:6379,abortConnect=false
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ticketrush
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-ticketrush}
      Admin__Enabled: "true"
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    # Портів назовні немає: усі запити йдуть через nginx, тому сервіс можна масштабувати.
    # TODO(Астахов): масштабування Booking API (`docker compose up -d --scale booking-api=3`) і обмеження ресурсів (deploy.resources.limits cpus/memory) однакові для тесту 1 vs 3 — у логах nginx/заголовку X-Instance видно всі 3 інстанси, результати тесту 1 vs 3 порівнянні.

  order-worker:
    build:
      context: .
      dockerfile: src/TicketRush.OrderWorker/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ticketrush;Username=ticketrush;Password=${POSTGRES_PASSWORD:-ticketrush}
      Redis__ConnectionString: redis:6379,abortConnect=false
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ticketrush
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-ticketrush}
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: on-failure

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["127.0.0.1:8080:80"]
    depends_on: [booking-api]

  # Запуск: docker compose run --rm --service-ports k6 run /scripts/spike.js  (див. README)
  k6:
    image: grafana/k6:0.54.0
    profiles: ["k6"]
    volumes:
      - ./loadtests:/scripts:ro
      - ./results:/results
    environment:
      BASE_URL: http://nginx
      K6_WEB_DASHBOARD: "true"
    ports: ["127.0.0.1:5665:5665"]
    depends_on: [nginx]

volumes:
  redis-data:
